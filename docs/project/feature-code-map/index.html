/* Keep explanation visible while the three trees scroll independently. */
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.top{flex-shrink:0}
.page{flex:1;width:100%;min-height:0;display:flex;flex-direction:column}
.explanation{flex-shrink:0;max-height:50dvh;overflow-y:auto}
.trees{flex:1;min-height:0;display:flex;flex-direction:column}
#tree-panel{flex:1;min-height:0}
#tree-panel,.tree-scroll,.canvas,.columns{height:100%}
.tree-scroll{overflow-y:hidden}
.lane{display:flex;flex-direction:column;min-height:0;height:100%}
.lane-head,.lane-foot{flex-shrink:0}
.tree{height:auto;flex:1;min-height:0;max-height:none}
#matrix-panel{min-height:0;height:100%;display:flex;flex-direction:column}
.matrix-toggle{flex-shrink:0}
.matrix-wrap{flex:1;min-height:0;max-height:none}
@media print{body{height:auto;overflow:visible;display:block}.page,.trees,.lane{display:block}#tree-panel,.tree-scroll,.canvas,.columns{height:auto}.tree{height:auto;overflow:visible}}

/* Stable selection: fixed inspector footprint and persistent tree nodes. */
.explanation{height:190px;min-height:190px;max-height:190px;position:relative;overflow:hidden}
.explain-main{height:100%;min-height:0;overflow:auto}
.explain-title{flex-wrap:nowrap;min-width:0}
.explain-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.expanded-detail{position:absolute;inset:0;height:100%;max-height:none;border:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.detail-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;margin-bottom:9px}
.detail-tabs{margin:0;flex-shrink:0}
#close-detail{border:0;background:transparent;padding:3px 5px;color:var(--muted);font-size:11px;white-space:nowrap}
#detail-body{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.row.dim{opacity:1}
.row.selected{box-shadow:inset 2px 0 var(--accent)}
#apply-search{font-size:11px;white-space:nowrap}
@media(max-width:740px){.explanation{height:205px;min-height:205px;max-height:205px}.tools input{width:135px}}
@media(max-height:600px){.explanation{height:155px;min-height:155px;max-height:155px}}
@media print{.explanation,.explain-main{height:auto;max-height:none;overflow:visible}.expanded-detail{position:static}}

.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#language{font-size:11px;min-width:34px;white-space:nowrap}

.tools input{flex:1;min-width:60px}
@media(max-width:740px){.brand #map-label{display:none}}
@media(max-width:520px){.tools{flex-wrap:wrap}.tools input{flex:1 1 calc(100% - 110px)}#apply-search{width:54px}#language{width:40px}.tools select{width:130px;max-width:130px}}

o matching nodes","nodeCount":"Nodes: {n}","linkedCount":" · Related: {n}","overview":"Implementation overview","searchResults":"Search results","choosePrompt":"Select a node to inspect its status, flow and source evidence.","resultPrompt":"Capabilities: {caps}; actions: {actions}. Select a node for evidence.","fileSummary":"Audited anchors: {proofs}; linked capabilities: {caps}.","fileUnmapped":"This file has no audited feature anchors yet.","symbolMapped":"This symbol has an audited feature mapping.","symbolUnmapped":"This symbol has not been audited individually; sharing a file does not establish its feature mapping.","actionSummary":"Actions ({n}): {items}.","auditedActions":"Audited actions: {n}.","archSummary":"Linked capabilities: {caps}; audited anchors: {proofs}.","locate":"Locate links","clearSelection":"Clear selection","copy":"Copy","copied":"Copied","fullPath":"Full path","proofCount":"Evidence: {n}","capCount":"Capabilities: {n}","viewDetails":"View details","closeDetails":"Close details","locateInTree":"Locate in tree","directDependencies":"Direct dependencies","usedBy":"Used by","potentialImpact":"Potential impact","impactSummary":"Packages: {packages}; capabilities: {caps}, inferred from recorded reverse package dependencies.","impactLimit":"Potential impact is not a confirmed regression; frontend imports, dynamic RPC and event dependencies are outside this graph.","noEvidence":"No action-level source evidence is linked to this node.","runtimeLimit":"Statuses come from source review; business tests and deployment were not verified.","scopeSummary":"Audited actions: {actions}; source anchors: {proofs}. Feature links point to exact files, symbols and source positions; architecture uses explicit project ownership rules.","scopeStates":"Implemented: the scoped action is wired in source. Partial: a concrete branch is missing. Placeholder: the entry falls back to a placeholder. Unverified: evidence is insufficient.","snapshot":"Current snapshot","scopeLim const nodes=new Map(data.nodes.map(n=>[n.id,n])),proofs=new Map(data.proofs.map(p=>[p.id,p])),children=new Map(),roots={feature:[],architecture:[],code:[]};

let expanded=initialExpanded(),selected=null,query='',statusFilter='all',detailOpen=false,detailTab='evidence',view='tree',scopeOwner=null;
let visible={feature:[],architecture:[],code:[]},activeProofs=new Set(),activeFiles=new Set(),related=new Set(),filterSet=null,allowedProofs=new Set(proofs.keys()),allowedActions=new Set(actions.map(a=>a.id)),raf=0;

function updateFilter(){
 const permitted=new Set(actions.filter(a=>statusFilter==='all'||nodes.get(a.parent)?.status===statusFilter).map(a=>a.id));allowedActions=new Set(permitted);filterSet=null;const hits=new Set(),q=query.toLowerCase();

 allowedProofs=new Set([...allowedActions].flatMap(id=>nodes.get(id).auditProofs||[]));

  if(query)for(const id of filterSet)ancestorsOpen(id);

function updateRelated(){
 activeProofs=selected?new Set([...ownProofs(selected)].filter(id=>allowedProofs.has(id))):new Set();
 if(scopeOwner){const ids=new Set(descendants(scopeOwner));activeProofs=new Set([...activeProofs].filter(id=>ids.has(proofs.get(id).arch)))}

function ensureSymbols(n){if(n.kind!=='file'||n.symbolsLoaded)return;n.symbolsLoaded=true;const existingLines=new Set((n.proofs||[]).map(id=>proofs.get(id).line));for(const [i,s] of(n.symbols||[]).entries()){if(existingLines.has(s.line))continue;const id='s:'+n.path+':'+s.line+':'+i;nodes.set(id,{id,lane:'code',kind:'symbol',label:s.name,parent:n.id,file:n.id,path:n.path,line:s.line,signature:s.signature});if(!children.has(n.id))children.set(n.id,[]);children.get(n.id).push(id)}}

 if(n.lane==='feature'&&n.kind!=='domain')extra=badge(n.status);else if(n.kind==='proof'||n.kind==='symbol')extra='<span class="number">:'+n.line+'</span>';else if(n.kind==='file'&&n.proofs?.length)extra='<span class="proof-mark" title="'+esc(t('auditedPosition'))+'"></span>';else if(n.kind==='domain')extra='<span class="number">'+descendants(n.id).filter(id=>nodes.get(id).kind==='capability').length+'</span>';

function renderLane(lane){let html='',ids=[];const show=id=>{const n=nodes.get(id);if(filterSet&&!filterSet.has(id)&&n.kind!=='symbol')return false;return true};

 const title=query?t('searchResults'):statusFilter==='all'?t('overview'):labelStatus(statusFilter),prompt=query||statusFilter!=='all'?t('resultPrompt',{caps:visibleCaps.length,actions:allowedActions.size}):t('choosePrompt');

 $('show-scope').onclick=showScope;$('expanded-detail').hidden=true;return}

function renderDetail(){if(!selected)return showScope();$('expanded-detail').querySelector('.detail-tabs').hidden=false;document.querySelectorAll('[data-detail]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.detail===detailTab)));const panel=$('detail-body');panel.dataset.mode='evidence';
 if(detailTab==='impact'){

}
function scopeContent(){return `<div class="two-columns"><div><h3>${t('scope')}</h3><p>${t('scopeSummary',{actions:data.statistics.auditedActions,proofs:data.statistics.proofs})}</p><p>${t('scopeStates')}</p></div><div><h3>${t('snapshot')}</h3><p class="mono">${esc(data.commit||'—')}<br>${esc(data.date)}</p><p>${t('scopeLimit')}</p></div></div>`}
function showScope(){if($('detail-body').dataset.mode==='scope'&&!$('expanded-detail').hidden){detailOpen=false;$('expanded-detail').hidden=true;$('explain-main').hidden=false;closeMenu();return}$('detail-body').dataset.mode='scope';$('expanded-detail').querySelector('.detail-tabs').hidden=true;detailOpen=true;$('explain-main').hidden=true;$('expanded-detail').hidden=false;$('detail-body').innerHTML=scopeContent();closeMenu()}
function updateHighlights(){
 for(const lane of lanes){const tree=$(lane+'-tree');for(const row of tree.querySelectorAll('[data-node]')){const id=row.dataset.node;row.classList.toggle('selected',selected===id);row.classList.toggle('related',related.has(id));row.classList.remove('dim');row.querySelector('.label').setAttribute('aria-pressed',String(selected===id))}$(lane+'-foot').textContent=t('nodeCount',{n:visible[lane].length})+(selected?t('linkedCount',{n:visible[lane].filter(id=>related.has(id)).length}):'')}

function choose(id){if(!nodes.has(id)||selected===id)return;selected=id;scopeOwner=null;updateRelated();updateHighlights();renderExplanation();scheduleWires()}

function visibleAnchor(id,lane){let n=nodes.get(id);while(n){if(visible[lane].includes(n.id)){const el=document.querySelector(`[data-node="${CSS.escape(n.id)}"]`),tree=$(lane+'-tree');if(!el)return null;const a=el.getBoundingClientRect(),b=tree.getBoundingClientRect();if(a.top>=b.top&&a.bottom<=b.bottom)return el}n=nodes.get(n.parent)}return null}
